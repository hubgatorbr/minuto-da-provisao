    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />

    <title>Minuto da Provisão | Devocional Diário para Empreendedores</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      if ('serviceWorker' in navigator) {
        try {
          const migrationKey = 'minuto-sw-migration';
          if (localStorage.getItem(migrationKey) !== 'v3') {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister()));
            const cacheKeys = await caches.keys();
            await Promise.all(cacheKeys.map(cacheKey => caches.delete(cacheKey)));
            localStorage.setItem(migrationKey, 'v3');
          }
        } catch {
          // Storage and service worker APIs may be restricted by the browser.
        }
      }
      await import('/src/main.tsx');
    </script>
    <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js?v=3', { updateViaCache: 'none' }));</script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
